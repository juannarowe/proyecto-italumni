<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <title>ITAlumni - Red de Exalumnos</title>
    <script type="module" src="/src/main.ts"></script>
</head>

<body>
    <main
        class="min-h-screen w-full flex items-center justify-center font-sans lg:bg-[url('./src/assets/Image.svg')] lg:bg-cover lg:bg-center lg:py-10">

        <div
            class="w-full min-h-screen bg-white px-8 py-12 flex flex-col justify-center lg:min-h-0 lg:max-w-[500px] lg:rounded-[2.5rem] lg:shadow-2xl">

            <div class="text-center mb-10">
                <h1 class="text-3xl font-bold text-it-dark mb-3">Crea un compte</h1>
                <p class="text-gray-500 text-sm leading-relaxed max-w-[280px] mx-auto">
                    Uneix-te a nosaltres per connectar-te i compartir oportunitats!
                </p>
            </div>

            <form class="space-y-4">

                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
                        <i class="fa-regular fa-user"></i>
                    </span>
                    <input type="text" placeholder="Posa el teu nom"
                        class="w-full pl-12 pr-4 py-3.5 bg-gray-50 border-none rounded-xl text-sm outline-none focus:ring-2 focus:ring-it-magenta/20 transition-all">
                </div>

                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
                        <i class="fa-regular fa-user"></i>
                    </span>
                    <input type="text" placeholder="Posa el teu cognom"
                        class="w-full pl-12 pr-4 py-3.5 bg-gray-50 border-none rounded-xl text-sm outline-none focus:ring-2 focus:ring-it-magenta/20 transition-all">
                </div>

                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
                        <i class="fa-regular fa-envelope"></i>
                    </span>
                    <input type="email" placeholder="El teu correu electrònic"
                        class="w-full pl-12 pr-4 py-3.5 bg-gray-50 border-none rounded-xl text-sm outline-none focus:ring-2 focus:ring-it-magenta/20 transition-all">
                </div>

                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" placeholder="Crea una contrasenya"
                        class="w-full pl-12 pr-4 py-3.5 bg-gray-50 border-none rounded-xl text-sm outline-none focus:ring-2 focus:ring-it-magenta/20 transition-all">
                </div>

                <div class="flex items-center gap-3 py-2">
                    <input type="checkbox" id="terms" class="w-4 h-4 rounded accent-it-magenta cursor-pointer">
                    <label for="terms" class="text-[11px] text-it-dark font-semibold cursor-pointer">
                        Accepto els Termes i Condicions
                    </label>
                </div>

                <button type="submit"
                    class="w-full py-4 bg-it-magenta text-white font-bold rounded-xl shadow-lg shadow-it-magenta/20 hover:opacity-90 active:scale-[0.98] transition-all mt-2">
                    Registra't
                </button>
            </form>

            <div class="relative flex items-center py-8">
                <div class="flex-grow border-t border-gray-100"></div>
                <span class="mx-4 text-gray-400 text-xs font-light">o</span>
                <div class="flex-grow border-t border-gray-100"></div>
            </div>

            <div class="space-y-3">
                <button
                    class="w-full flex items-center justify-center gap-3 py-3.5 bg-it-magenta-light text-it-magenta rounded-2xl text-sm font-semibold transition-colors hover:bg-pink-100">
                    <i class="fa-brands fa-apple text-lg"></i> Continua amb Apple
                </button>

                <button
                    class="w-full flex items-center justify-center gap-3 py-3.5 bg-[#FFF5F5] text-[#EA4335] rounded-2xl text-sm font-semibold transition-colors hover:bg-red-100">
                    <i class="fa-brands fa-google"></i> Continua amb Google
                </button>

                <button
                    class="w-full flex items-center justify-center gap-3 py-3.5 bg-[#F0F7FF] text-[#1877F2] rounded-2xl text-sm font-semibold transition-colors hover:bg-blue-100">
                    <i class="fa-brands fa-facebook"></i> Continua amb Facebook
                </button>
            </div>

            <div class="text-center mt-10 text-[11px] text-it-dark">
                Ja t'has registrat?
                <a href="#" class="text-it-magenta font-bold ml-1 hover:underline">Inicia sessió</a>
            </div>

        </div>
    </main>
</body>

</html>
